# Blueprint Render : backend FastAPI de la BETA (staging) -- DEPLOYMENT.md §12.
#
# Pile : Render (backend, ce fichier) + Supabase (PostgreSQL/PostGIS et
# Storage S3) + Vercel (front, frontend/vercel.json). Le runbook Railway
# (backend/railway.json) reste inchangé et indépendant de ce fichier.
#
# - Image construite depuis backend/Dockerfile (la même que Railway).
# - Démarrage : scripts/serve.py -- configuration validée, migrations
#   (alembic upgrade head, sous verrou), puis uvicorn sur $PORT. Le plan
#   gratuit n'a ni shell ni étape de pré-déploiement : les migrations
#   passent donc au démarrage.
# - Aucun secret ici : les valeurs `sync: false` sont demandées par Render à
#   la création du Blueprint (puis modifiables dans le tableau de bord) ;
#   JWT_SECRET est tiré au hasard par Render (256 bits).
services:
  - type: web
    name: teranga-backend
    runtime: docker
    plan: free
    # Même région que le projet Supabase (Francfort, eu-central-1) : chaque
    # requête SQL traverse le réseau, la distance compte. Non modifiable ensuite.
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python scripts/serve.py
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    # Ne reconstruire le backend que si le backend change.
    buildFilter:
      paths:
        - backend/**
    envVars:
      # --- Comportement de la beta (valeurs fixées, DEPLOYMENT.md §12.3) ---
      - key: ENVIRONMENT
        value: staging
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: STORAGE_BACKEND
        value: s3
      - key: WEB_CONCURRENCY
        value: "1"
      # --- Secrets et adresses propres au déploiement (saisis à la création) ---
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_PUBLIC_BASE_URL
        sync: false
      - key: BACKEND_PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Livraison des codes : console (aucun code réel) ou termii (DEPLOYMENT.md
      # §13). Non fixée ici : une synchronisation du Blueprint ne doit jamais
      # écraser le choix fait dans le tableau de bord.
      - key: SMS_PROVIDER
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      # E-mails aux admins (DEPLOYMENT.md §14) : console par défaut si absent.
      - key: EMAIL_PROVIDER
        sync: false
      # Render bloque le SMTP sortant : EMAIL_PROVIDER=brevo (API HTTP).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFICATION_EMAILS
        sync: false
      # Notifications push des nouveaux messages (DEPLOYMENT.md §15) :
      # WEB_PUSH_ENABLED=true exige la paire VAPID_* au démarrage.
      - key: WEB_PUSH_ENABLED
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # À MESURER après le premier déploiement (DEPLOYMENT.md §12.6).
      - key: TRUSTED_PROXY_HOPS
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Heures pour signaler un problème après la fin des travaux
      # (DEPLOYMENT.md §16) : 72 par défaut si absente, 0 = désactivé.
      - key: DISPUTE_WINDOW_HOURS
        sync: false
      # Codes de connexion (DEPLOYMENT.md §18). OTP_HMAC_KEY : SECRET
      # OBLIGATOIRE hors développement (scripts/generate_otp_hmac_key.py).
      - key: OTP_HMAC_KEY
        sync: false
      # Limites et plafond global de SMS : valeurs par défaut sûres si
      # absentes (config.py) ; à n'ajuster qu'en connaissance de cause.
      - key: RATE_LIMIT_OTP_PER_PHONE_MAX
        sync: false
      - key: RATE_LIMIT_OTP_PER_PHONE_DAILY_MAX
        sync: false
      - key: RATE_LIMIT_OTP_PER_IP_MAX
        sync: false
      - key: RATE_LIMIT_OTP_PER_IP_DAILY_MAX
        sync: false
      - key: RATE_LIMIT_OTP_VERIFY_PER_PHONE_MAX
        sync: false
      - key: RATE_LIMIT_OTP_VERIFY_PER_IP_MAX
        sync: false
      - key: OTP_SMS_GLOBAL_MAX_PER_HOUR
        sync: false
      - key: OTP_SMS_GLOBAL_MAX_PER_DAY
        sync: false
      - key: OTP_SMS_ALERT_THRESHOLD_PERCENT
        sync: false
      # Zone d'intervention des artisans (DEPLOYMENT.md §19) : défauts sûrs
      # si absentes (config.py) ; la région doit contenir tous les quartiers.
      - key: SERVICE_REGION_CENTER_LAT
        sync: false
      - key: SERVICE_REGION_CENTER_LNG
        sync: false
      - key: SERVICE_REGION_RADIUS_M
        sync: false
      - key: ARTISAN_GPS_GRID_M
        sync: false
      - key: ARTISAN_LOCATION_CHANGES_SHORT_MAX
        sync: false
      - key: ARTISAN_LOCATION_CHANGES_SHORT_WINDOW_HOURS
        sync: false
      - key: ARTISAN_LOCATION_CHANGES_LONG_MAX
        sync: false
      - key: ARTISAN_LOCATION_CHANGES_LONG_WINDOW_DAYS
        sync: false
      - key: ARTISAN_SERVICE_RADIUS_MAX_M
        sync: false
      - key: PUBLIC_DISTANCE_ROUNDING_M
        sync: false
      - key: OTP_TEST_WHITELIST
        sync: false
      - key: OTP_TEST_CODE
        sync: false
