[project]
name = "teranga-backend"
version = "0.1.0"
description = "Téranga Services — API backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "geoalchemy2>=0.15",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 : l'injection de dépendances de FastAPI repose sur `Depends(...)` en
# argument par défaut — c'est le pattern idiomatique voulu, pas une erreur.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# E402 : le script insère backend/ sur sys.path avant d'importer `app` --
# nécessaire car il s'exécute comme fichier (pas `python -m`), donc Python ne
# met que scripts/ sur sys.path, pas backend/.
"scripts/seed.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
