# FACULTATIF — services « comme en production » pour un essai local
# (DEPLOYMENT.md, « Essayer Redis et S3 en local »). Le développement normal
# n'en a PAS besoin : sans REDIS_URL ni STORAGE_BACKEND=s3, le backend
# retombe sur la mémoire et le disque local.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down -v   # arrêt + effacement
#
# Identifiants ci-dessous : LOCAUX ET JETABLES, valables uniquement pour ces
# conteneurs sur votre poste — jamais pour un environnement réel.
name: teranga-dev-services

services:
  redis:
    image: redis:7.4-alpine
    ports:
      - "${TERANGA_REDIS_PORT:-6379}:6379"

  minio:
    # Étiquette « latest » officielle : outil de dev facultatif, jamais déployé.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: teranga-local
      MINIO_ROOT_PASSWORD: teranga-local-only
    ports:
      - "${TERANGA_MINIO_PORT:-9000}:9000"
      - "${TERANGA_MINIO_CONSOLE_PORT:-9001}:9001"

  # Crée les deux buckets : privé (aucun accès anonyme) et public (lecture
  # anonyme seule), comme en production.
  minio-buckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 teranga-local teranga-local-only; do sleep 1; done;
      mc mb --ignore-existing local/teranga-prive;
      mc mb --ignore-existing local/teranga-public;
      mc anonymous set none local/teranga-prive;
      mc anonymous set download local/teranga-public;
      "
